name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="nightly-$(date -u +%Y-%m-%d)"

          # Delete existing release for today if re-triggered
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, replacing..."
            gh release delete "$tag" --yes --cleanup-tag
          fi

          gh release create "$tag" \
            --title "Nightly build ($tag)" \
            --target dev \
            --notes "Automated nightly build from \`dev\` branch.

          **Packages included:**
          - **macOS** (Universal): DMG installer
          - **Windows** (x64): Inno Setup installer
          - **Linux** (x86_64): Flatpak bundle" \
            --prerelease \
            artifacts/*

      - name: Clean up old nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # List all nightly releases sorted by date (newest first), skip first 3, delete the rest
          gh release list --limit 100 | \
            grep '^nightly-' | \
            awk '{print $1}' | \
            tail -n +4 | \
            while read -r tag; do
              echo "Deleting old nightly: $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
