name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            preset: ci-macos
            platform-preset: macos-relwithdebinfo
            qt-arch: clang_64
          - os: windows-latest
            preset: ci-windows
            platform-preset: windows-relwithdebinfo
            qt-arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew list ninja || brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Generate CI presets
        shell: python3 {0}
        run: |
          import json, os
          qt_root = os.environ["QT_ROOT_DIR"].replace("\\", "/")
          preset = "${{ matrix.preset }}"
          platform_preset = "${{ matrix.platform-preset }}"
          data = {
              "version": 8,
              "configurePresets": [{"name": preset, "inherits": platform_preset, "cacheVariables": {"CMAKE_PREFIX_PATH": qt_root}}],
              "buildPresets": [{"name": preset, "configurePreset": preset}],
              "testPresets": [{"name": preset, "configurePreset": preset}],
          }
          with open("CMakeUserPresets.json", "w") as f:
              json.dump(data, f, indent=2)

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
